<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3화 · 연남동 3층집 단톡 UI</title>
<style>
/* 바깥 작업실 패널 */
:root{color-scheme:light;--bg:#e8e4df;--line:#ddd8d2;--green:#285b45;--muted:#69736b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#222;font:15px/1.5 "Apple SD Gothic Neo","Noto Sans KR","Helvetica Neue",Arial,sans-serif}
header{max-width:920px;margin:0 auto;padding:20px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header .brand{font-weight:750;font-size:18px}header a{color:var(--green)}header .sub{color:var(--muted);font-size:13px}
.wrap{max-width:920px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:390px 1fr;gap:20px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
.wrap>*{min-width:0}
.panel{background:#fffefa;border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h2{margin:0 0 6px;font-size:18px}.panel .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ctrl button,.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.ctrl button.primary{background:var(--green);color:#fff;border-color:var(--green)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.profiles{display:grid;grid-template-columns:1fr;gap:10px}
.pcard{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px}
.pcard .av{width:48px;height:48px;border-radius:50%;background:#cfcbc7 center/cover no-repeat}
.pcard .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pcard .tag{display:inline-block;background:#edece4;border-radius:999px;padding:2px 8px;font-size:11px;margin-right:4px}
.av img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.state-label{font-size:13px;color:var(--muted);margin-bottom:8px}
[hidden]{display:none!important}
html.export,html.export body{width:830px;height:1800px;overflow:hidden;background:#f2eeeb}
html.export header,html.export aside{display:none}
html.export .wrap{display:block;width:830px;max-width:none;margin:0;padding:0}
html.export .phone{width:390px;max-width:none;height:845.783133px;margin:0;border:0;transform:scale(2.1282051282);transform-origin:top left}
html.export .chat{height:auto;min-height:0;flex:1}

/* 토마톡 말풍선 = render_ui_v2.py CSS를 390px 폭에 맞춤 (W830·F1.5 비율) */
/* 앱 화면만 390px. 폰 베젤/외곽은 phone_mockup.py로만 (독자 셸 금지) */
.phone{width:390px;max-width:100%;background:#f2eeeb;border:1px solid #e6e2de;overflow:hidden;margin:0 auto;display:flex;flex-direction:column}
.hdr{height:66px;background:#fff;display:flex;align-items:center;padding:0 18px;box-shadow:0 1px 0 #e6e2de;flex:none}
.hdr .back{width:11px;height:11px;border-left:2px solid #333;border-bottom:2px solid #333;transform:rotate(45deg);margin-left:4px;text-indent:-9999px;overflow:hidden}
.hdr .title{flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.5px}
.hdr .acts{display:flex;gap:14px;align-items:center}
.hdr .acts svg{width:18px;height:18px}
/* 실제 토마톡 공지 바: 헤더 바로 아래 흰 한 줄 + 확성기 + 펼침 화살표 */
.notice{flex:none;background:#fff;border-bottom:1px solid #ebe7e3;display:flex;flex-direction:column}
.notice-bar{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;min-height:44px}
.notice-bar .ico{width:18px;height:18px;flex:none;color:#222}
.notice-bar .txt{flex:1;min-width:0;font-size:14px;font-weight:500;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.notice-bar .chev{width:14px;height:14px;flex:none;color:#888;transition:transform .15s}
.notice.open .notice-bar .chev{transform:rotate(180deg)}
.notice-full{display:none;padding:0 14px 12px 42px;font-size:13px;line-height:1.45;color:#444;border-top:0}
.notice.open .notice-full{display:block}
.chat{height:560px;overflow:auto;padding:14px 18px 18px;display:flex;flex-direction:column;gap:16px;background:#f2eeeb}
.row{display:flex;gap:8px;align-items:flex-start;max-width:88%}
.av{width:36px;height:36px;border-radius:50%;background:#cfcbc7 center/cover no-repeat;flex:none}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.name{font-size:12px;color:#222;margin-left:2px}
/* 핵심: 흰+회색이 한 덩어리 (개별 둥근 말풍선 X) */
.stack{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;position:relative;min-width:0;max-width:100%}
.b{padding:10px 12px;font-size:14.5px;line-height:1.35;word-break:break-word;position:relative}
.b.tr{background:#fff;color:#222}
.b.or{background:#c9c9c9;color:#555;font-weight:600;padding-right:52px}
.b.solo{padding-right:52px}
.t{position:absolute;right:8px;bottom:7px;font-size:10px;color:#555;font-weight:500;white-space:nowrap}
.row.mine{align-self:flex-end;flex-direction:row-reverse;max-width:80%}
.row.mine .b{background:#f7d9d9;color:#222;padding-right:12px}
.row.mine .tl{align-self:flex-end;font-size:10px;color:#555;margin:0 6px 6px 0;white-space:nowrap}
.photo{background:#ddd6ce;border-radius:12px;padding:26px 12px;text-align:center;color:#6a645e;font-size:13px;margin-bottom:4px;max-width:220px}
.inp{background:#f2eeeb;padding:10px 16px 16px;display:flex;align-items:center;gap:10px;flex:none}
.inp .plus{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;color:#333;flex:none;font-weight:300}
.inp .field{flex:1;height:36px;background:#fff;border-radius:20px;display:flex;align-items:center;padding:0 40px 0 14px;font-size:13px;color:#9a9a9a;position:relative}
.inp .field .smile{position:absolute;right:12px;width:18px;height:18px;border:2px solid #555;border-radius:50%}
.inp .send{width:36px;height:36px;border-radius:50%;background:#c9c5c1;display:grid;place-items:center;flex:none}
.inp .send svg{width:16px;height:16px}
</style>
<header>
  <div><div class="brand">3화 단톡 UI 초안</div><small class="sub">준호 폰 · 한국어 뷰 · 앱 화면 390px (폰 외곽은 phone_mockup)</small></div>
  <div><a href="../series.html#EP03/story">← 3화 작업실</a> · <a href="../index.html#board">공통 보드</a></div>
</header>
<div class="wrap">
  <div class="phone" id="phone">
    <div class="hdr">
      <a class="back" href="#" aria-label="뒤로">‹</a>
      <div class="title" id="roomTitle">연남동 3층집 🏠</div>
      <div class="acts" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" stroke="#333" stroke-width="3"><circle cx="17" cy="17" r="11"/><path d="M26 26l9 9"/></svg>
        <svg viewBox="0 0 40 40" fill="none" stroke="#333" stroke-width="3"><path d="M6 11h28M6 20h28M6 29h28"/></svg>
      </div>
    </div>
    <div class="notice" id="noticeBox">
      <div class="notice-bar" id="noticeToggle" role="button" aria-expanded="false" tabindex="0">
        <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10v4h3l5 4V6L6 10H3z" fill="currentColor"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M18.7 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="txt" id="noticePreview"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="notice-full" id="noticeText"></div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="inp">
      <div class="plus">+</div>
      <div class="field">메시지를 입력하세요.<div class="smile"></div></div>
      <div class="send"><svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3"><path d="M6 20L34 7 27 34 18 24z"/><path d="M18 24L34 7"/></svg></div>
    </div>
  </div>
  <aside class="panel">
    <h2 id="stateTitle">상태</h2>
    <p class="sub" id="stateBeat"></p>
    <div class="ctrl">
      <button type="button" id="prevBtn">← 이전 상태</button>
      <button type="button" class="primary" id="nextBtn">다음 상태 →</button>
    </div>
    <div class="tabs" id="stateTabs" aria-label="UI 상태"></div>
    <div class="tabs" role="tablist">
      <button type="button" id="tabChat" aria-pressed="true">채팅</button>
      <button type="button" id="tabProfiles" aria-pressed="false">프로필 목록</button>
    </div>
    <div id="chatHelp" class="state-label">컷별로 보이는 메시지만 표시. 번역 원문은 검수 전 초안.</div>
    <div id="exportLinks" class="state-label"></div>
    <div id="profilePanel" hidden>
      <p class="sub">기존 확정 얼굴 아바타(임시). 「최종 제안」은 아직 미제작.</p>
      <div class="profiles" id="profiles"></div>
    </div>
  </aside>
</div>
<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
  const D=JSON.parse(document.getElementById('data').textContent);
  const params=new URLSearchParams(location.search);
  let i=Math.max(0,Math.min(D.states.length-1,(Number(params.get('state'))||1)-1)); let mode='chat';
  if(params.has('export')) document.documentElement.classList.add('export');
  const chat=document.getElementById('chat');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const byId=Object.fromEntries(D.profiles.map(p=>[p.id,p]));
  document.getElementById('roomTitle').textContent=D.room;
  document.getElementById('noticePreview').textContent=D.notice;
  document.getElementById('noticeText').textContent=D.notice;
  const noticeBox=document.getElementById('noticeBox');
  const noticeToggle=document.getElementById('noticeToggle');
  function setNoticeOpen(open){
    noticeBox.classList.toggle('open',open);
    noticeToggle.setAttribute('aria-expanded',String(open));
  }
  noticeToggle.onclick=()=>setNoticeOpen(!noticeBox.classList.contains('open'));
  noticeToggle.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();noticeToggle.click();}};

  function avUrl(p){return 'avatars/'+p.av;}
  function renderProfiles(){
    document.getElementById('profiles').innerHTML=D.profiles.map(p=>`
      <div class="pcard">
        <div class="av"><img src="${avUrl(p)}" alt="${esc(p.name)}"></div>
        <div>
          <div><b>${esc(p.name)}</b> ${esc(p.name_en)} ${p.flag}</div>
          <div class="meta"><span class="tag">${p.avatar_status==='existing'?'기존 아바타':'제안'}</span><span class="tag">${esc(p.lang)}</span> ${esc(p.av)}</div>
          <div class="meta">최종 제안: ${esc(p.final_profile_idea)}</div>
        </div>
      </div>`).join('');
  }
  function bubble(m){
    if(m.type==='notice'){
      return `<div class="notice" style="margin:0"><b>공지</b>${esc(m.text)}</div>`;
    }
    const p=byId[m.who]; if(!p) return '';
    const mine=p.id==='junho';
    const photo=m.photo?`<div class="photo">🖼 ${esc(m.photo)}</div>`:'';
    if(mine){
      return `<div class="row mine"><div class="stack">${photo}<div class="b">${esc(m.ko)}</div></div><div class="tl">${esc(m.time||'')}</div></div>`;
    }
    // EP03 브리프: 상대 한국어=흰만 / 외국어=흰 번역+회색 원문 (스택 한 덩어리)
    const foreign=p.lang && p.lang!=='ko' && m.orig;
    let stack;
    if(foreign){
      stack=`<div class="stack"><div class="b tr">${esc(m.ko)}</div><div class="b or">${esc(m.orig)}<span class="t">${esc(m.time||'')}</span></div></div>`;
    }else{
      stack=`<div class="stack"><div class="b tr solo">${esc(m.ko)}<span class="t">${esc(m.time||'')}</span></div></div>`;
    }
    return `<div class="row"><div class="av"><img src="${avUrl(p)}" alt="${esc(p.name)}"></div><div class="col"><div class="name">${esc(p.name)} ${p.flag}</div>${photo}${stack}</div></div>`;
  }
  function renderTabs(){
    document.getElementById('stateTabs').innerHTML=D.states.map((s,idx)=>
      `<button type="button" data-i="${idx}" aria-pressed="${idx===i}">${idx+1}. ${esc(s.title)}</button>`).join('');
  }
  function renderChat(){
    const s=D.states[i];
    document.getElementById('stateTitle').textContent=`${i+1}/${D.states.length} · ${s.title}`;
    document.getElementById('stateBeat').textContent=s.beat;
    const files=(D.exports||[]).find(f=>f.id===s.id);
    document.getElementById('exportLinks').innerHTML=files?`<a href="${files.screen}" target="_blank" rel="noopener">화면 PNG ↗</a> · <a href="${files.mockup}" target="_blank" rel="noopener">공용 폰 목업 ↗</a>`:'';
    chat.innerHTML=s.messages.map(bubble).join('');
    chat.scrollTop=chat.scrollHeight;
    renderTabs();
    document.getElementById('prevBtn').disabled=i<=0;
    document.getElementById('nextBtn').disabled=i>=D.states.length-1;
  }
  function setMode(m){
    mode=m;
    document.getElementById('tabChat').setAttribute('aria-pressed',String(m==='chat'));
    document.getElementById('tabProfiles').setAttribute('aria-pressed',String(m==='profiles'));
    document.getElementById('profilePanel').hidden=m!=='profiles';
    document.getElementById('chatHelp').hidden=m!=='chat';
    document.getElementById('phone').hidden=m!=='chat';
  }
  document.getElementById('prevBtn').onclick=()=>{if(i>0){i--;renderChat();}};
  document.getElementById('nextBtn').onclick=()=>{if(i<D.states.length-1){i++;renderChat();}};
  document.getElementById('stateTabs').onclick=e=>{const b=e.target.closest('button[data-i]');if(!b)return;i=+b.dataset.i;renderChat();setMode('chat');};
  document.getElementById('tabChat').onclick=()=>setMode('chat');
  document.getElementById('tabProfiles').onclick=()=>setMode('profiles');
  renderProfiles(); renderChat(); setMode('chat');
})();
</script>
