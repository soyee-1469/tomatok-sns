<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>연남동 3층집 · 회차 작업실</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--paper:#fffefa;--ink:#262f29;--muted:#69736b;--line:#dddeda;--green:#285b45;--warn:#8a4b1f;--err:#7a2e2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
header,main{max-width:1240px;margin:auto;padding:28px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}
a{color:var(--green)}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #b58a30;outline-offset:4px}
.brand{font-size:19px;font-weight:750}.sub,small{color:var(--muted)}
h1{font-size:clamp(28px,4vw,42px);line-height:1.3;letter-spacing:-1px}h2{font-size:23px}h3{font-size:17px;margin:0}
p{margin:10px 0 20px}
.notice{background:#eaf0e9;border:1px solid #d7e2d5;padding:18px 22px;border-radius:14px;margin:24px 0}
.notice.warn{background:#f7efe4;border-color:#e6d3b8;color:var(--warn)}
.notice.err{background:#f6e8e8;border-color:#e3c4c4;color:var(--err)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}
.card{display:flex;flex-direction:column;align-items:start;gap:8px}.card h2{margin:0}.card p{flex:1}
.badge{background:#edece4;border-radius:30px;padding:4px 12px;font-size:13px;display:inline-block}
.primary{background:var(--green);color:white;border:0;border-radius:9px;padding:10px 20px}
.back{border:0;background:none;padding:0;color:var(--green)}
nav{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--paper);padding:10px 20px;border-radius:30px}
nav button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}
.prose{max-width:900px;overflow-wrap:anywhere}.prose h1{font-size:26px}.prose h2{margin-top:32px}
.prose table{display:block;overflow:auto;border-collapse:collapse;font-size:14px}
.prose th,.prose td{border:1px solid var(--line);padding:9px;min-width:95px}.prose img{max-width:100%}
.images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.images figure{margin:0}.images img{width:100%;border-radius:10px;display:block}
.images figcaption{font-size:13px;color:var(--muted);margin:8px 0;overflow-wrap:anywhere}
.empty{padding:38px 12px;text-align:center}.rules{padding-left:22px}.rules li{margin:10px 0}
footer{margin-top:28px;font-size:13px;color:var(--muted)}[hidden]{display:none!important}
.episode-nav{position:sticky;top:0;z-index:10;max-width:1240px;margin:0 auto;padding:12px 28px;background:var(--bg);border-bottom:1px solid var(--line);gap:8px;display:flex;flex-wrap:wrap}
.episode-nav a{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border:1px solid var(--line);border-radius:30px;background:var(--paper);text-decoration:none;white-space:nowrap}
.episode-nav a[aria-current=page]{background:var(--green);border-color:var(--green);color:white}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px}
.filters button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.cut{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 18px;background:#fff}
.cut-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.cut-meta{color:var(--muted);font-size:13px}
.line{font-size:18px;font-weight:650;margin:4px 0 8px}
.dir{font-size:13px;color:var(--muted);margin:0 0 12px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfaf7;min-width:0}
.col h4{margin:0 0 8px;font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.frame{aspect-ratio:9/16;max-height:360px;background:#e8e4df;border-radius:8px;overflow:hidden;display:grid;place-items:center;position:relative}
.frame img,.frame video{width:100%;height:100%;object-fit:contain;background:#111}
.frame .cap{position:absolute;left:8px;right:8px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.35;text-align:center}
body.hide-caps .frame .cap{display:none}
.missing{color:var(--muted);font-size:13px;padding:24px 8px;text-align:center}
.row-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.row-ctrl select, .review select, .review textarea{font:inherit;max-width:100%}
.review{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:8px}
.review-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.review textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px}
.tag-ref{background:#efe7d4}.tag-miss{background:#f0e0e0}.tag-check{background:#e8e0f0}.tag-stale{background:#f3e2d2;color:var(--warn)}
.tag-ok{background:#dfece4}.tag-fix{background:#f3e2d2}.tag-pending{background:#edece4}
.basis{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.script-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.save-bar{position:sticky;bottom:0;z-index:12;background:rgba(246,244,239,.95);border-top:1px solid var(--line);padding:10px 28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.save-bar .ok{color:var(--green)}.save-bar .bad{color:var(--err)}
details.old{margin-top:18px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
@media(max-width:760px){header,main{padding:20px}.grid,.images{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.panel{padding:18px}.episode-nav{padding:10px 20px}.save-bar{padding:10px 20px}}
</style>
<header><div><div class="brand">연남동 3층집</div><small>시리즈 작업실</small></div><a href="index.html#board">공통 캐릭터·장소 / 기존 보드 ↗</a></header>
<nav class="episode-nav" id="episodeNav" aria-label="회차 바로가기"></nav>
<main id="app"></main>
<div class="save-bar" id="saveBar" hidden>
  <span id="saveMsg" class="sub">검토 기록 대기</span>
  <button type="button" class="primary" id="saveBtn" hidden>다시 저장</button>
</div>
<script type="application/json" id="episodes">__EPISODES__</script>
<script type="application/json" id="boardMeta">__BOARD_META__</script>
<script>
const episodes=JSON.parse(document.getElementById('episodes').textContent);
const boardMeta=(()=>{try{return JSON.parse(document.getElementById('boardMeta').textContent)}catch(e){return {}}})();
const app=document.getElementById('app');
const saveBar=document.getElementById('saveBar');
const saveMsg=document.getElementById('saveMsg');
const saveBtn=document.getElementById('saveBtn');
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PathName=p=>{try{return String(p).split('/').pop()}catch(e){return p}};
const STATUS_LABEL={pending:'미검토',needs_fix:'수정 요청',approved:'승인'};
const ASSIGNEE_LABEL={unassigned:'미지정',claude:'클로드',cursor:'커서',codex:'코덱스'};

const state={
  filter:'all',
  captions:true,
  take:{},          // epId -> {cutId: takeNum} local overrides before hydrate
  reviews:{},       // full store.episodes
  openDetails:new Set(),
  saveError:null,
  saveOkAt:null,
  dirty:false,
  loaded:false,
};

function reviewOf(epId, cutId){
  const cuts=state.reviews[epId]?.cuts||{};
  return cuts[String(cutId)]||{take:null,status:'pending',memo:'',assignee:'unassigned'};
}

function setReview(epId, cutId, patch){
  const ep=state.reviews[epId]||(state.reviews[epId]={cuts:{}});
  if(!ep.cuts) ep.cuts={};
  const key=String(cutId);
  const prev=ep.cuts[key]||{take:null,status:'pending',memo:'',assignee:'unassigned'};
  ep.cuts[key]={...prev,...patch,updatedAt:new Date().toISOString()};
  state.dirty=true;
}

function selectedTake(epId, cut){
  const key=String(cut.n);
  const saved=reviewOf(epId, key).take;
  if(saved!=null) return saved;
  if(state.take[epId]?.[key]!=null) return state.take[epId][key];
  return cut.video?.default_take;
}

function capturePlayback(){
  const map=new Map();
  app.querySelectorAll('video[data-vid]').forEach(v=>{
    map.set(v.dataset.vid,{t:v.currentTime||0, paused:v.paused, rate:v.playbackRate||1});
  });
  return map;
}

function restorePlayback(map){
  if(!map) return;
  app.querySelectorAll('video[data-vid]').forEach(v=>{
    const s=map.get(v.dataset.vid);
    if(!s) return;
    const apply=()=>{
      try{
        if(Math.abs((v.currentTime||0)-s.t)>0.15) v.currentTime=s.t;
        v.playbackRate=s.rate||1;
        if(!s.paused){ const p=v.play(); if(p&&p.catch) p.catch(()=>{}); }
        else v.pause();
      }catch(e){}
    };
    if(v.readyState>=1) apply(); else v.addEventListener('loadedmetadata',apply,{once:true});
  });
}

function captureOpenDetails(){
  state.openDetails.clear();
  app.querySelectorAll('details[data-details].dir').forEach(d=>{
    if(d.open) state.openDetails.add(d.dataset.details);
  });
}

function restoreOpenDetails(){
  app.querySelectorAll('details[data-details].dir').forEach(d=>{
    d.open=state.openDetails.has(d.dataset.details);
  });
}

function setSaveUI(){
  saveBar.hidden=false;
  if(state.saveError){
    saveMsg.className='bad';
    saveMsg.textContent='저장 실패 · 화면 기록은 유지됨 · '+state.saveError;
    saveBtn.hidden=false;
    return;
  }
  if(state.dirty){
    saveMsg.className='sub';
    saveMsg.textContent='저장 중…';
    saveBtn.hidden=true;
    return;
  }
  saveMsg.className='ok';
  saveMsg.textContent=state.saveOkAt?('저장됨 · '+state.saveOkAt):'서버 기록 연결됨';
  saveBtn.hidden=true;
}

async function loadReviews(){
  try{
    const res=await fetch('/api/reviews',{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    state.reviews=data.episodes||{};
    state.loaded=true;
    state.saveError=null;
    setSaveUI();
  }catch(err){
    state.saveError='검토 기록을 불러오지 못했습니다: '+(err.message||err);
    setSaveUI();
  }
}

let saveTimer=null;
function queueSave(){
  state.dirty=true;
  setSaveUI();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(persistReviews,250);
}

async function persistReviews(){
  const snapshot=JSON.parse(JSON.stringify({episodes:state.reviews}));
  state.dirty=true;
  setSaveUI();
  try{
    const res=await fetch('/api/reviews',{
      method:'PUT',
      headers:{'Content-Type':'application/json; charset=utf-8'},
      body:JSON.stringify(snapshot)
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok||data.ok===false) throw new Error(data.error||('HTTP '+res.status));
    if(data.store?.episodes) state.reviews=data.store.episodes;
    state.dirty=false;
    state.saveError=null;
    state.saveOkAt=new Date().toLocaleString('ko-KR');
    setSaveUI();
  }catch(err){
    // 기존 화면 기록(state.reviews)은 그대로 둔다
    state.saveError=String(err.message||err);
    setSaveUI();
  }
}

function cutMatchesFilter(c){
  if(state.filter==='video') return c.video && c.video.selected_exists;
  if(state.filter==='novideo') return !(c.video && c.video.selected_exists);
  if(state.filter==='noconti') return c.conti && (c.conti.status==='unlinked' || c.conti.status==='check');
  if(state.filter==='linked') return c.conti && c.conti.status==='linked';
  return true;
}

function applyFilterVisibility(root){
  (root||app).querySelectorAll('.cut[data-n]').forEach(el=>{
    const show=el.dataset.match!=='0';
    el.hidden=!show;
  });
  (root||app).querySelectorAll('[data-filter]').forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset.filter===state.filter));
  });
}

function applyCaptionMode(){
  document.body.classList.toggle('hide-caps', !state.captions);
  app.querySelectorAll('[data-cap]').forEach(b=>{
    b.setAttribute('aria-pressed', String(state.captions));
    b.textContent='자막 '+(state.captions?'켜짐':'꺼짐');
  });
}

function updateCutVideo(epId, cutEl, cut){
  const takeNum=selectedTake(epId, cut);
  const takes=cut.video?.takes||[];
  const takeObj=takes.find(t=>t.take===takeNum) || takes.find(t=>t.path===cut.video?.selected) || null;
  const videoSrc=takeObj?.board_src || cut.video?.board_src || '';
  const frame=cutEl.querySelector('[data-role=video-frame]');
  const label=cutEl.querySelector('[data-role=take-label]');
  const select=cutEl.querySelector('select[data-cut]');
  if(select && String(select.value)!==String(takeNum) && takeNum!=null) select.value=String(takeNum);
  if(label) label.textContent=takeObj?`take${String(takeObj.take).padStart(2,'0')}`:(cut.video?.selected?PathName(cut.video.selected):'');
  if(!frame) return;
  let video=frame.querySelector('video[data-vid]');
  if(!videoSrc){
    frame.innerHTML=`<div class="missing">${cut.video?.selected?'영상 파일 없음':'영상 없음'}</div>`;
    return;
  }
  const capHtml=state.captions && cut.spoken_line ? `<div class="cap">${escape(cut.who?cut.who+' · ':'')}${escape(cut.line)}</div>` : (cut.spoken_line?`<div class="cap">${escape(cut.who?cut.who+' · ':'')}${escape(cut.line)}</div>`:'');
  if(!video){
    const keep=capturePlayback();
    frame.innerHTML=`<video data-vid="${escape(epId)}:${escape(cut.n)}" src="${escape(videoSrc)}" controls playsinline preload="metadata"></video>${capHtml}`;
    restorePlayback(keep);
    return;
  }
  const prevTime=video.currentTime||0;
  const wasPaused=video.paused;
  if(video.getAttribute('src')!==videoSrc){
    video.setAttribute('src', videoSrc);
    video.load();
    video.addEventListener('loadedmetadata',()=>{
      try{ video.currentTime=Math.min(prevTime, video.duration||prevTime); }catch(e){}
      if(!wasPaused){ const p=video.play(); if(p&&p.catch) p.catch(()=>{}); }
    },{once:true});
  }
  let cap=frame.querySelector('.cap');
  if(cut.spoken_line){
    if(!cap){ cap=document.createElement('div'); cap.className='cap'; frame.appendChild(cap); }
    cap.textContent=(cut.who?cut.who+' · ':'')+cut.line;
  }else if(cap){ cap.remove(); }
}

function updateReviewUI(epId, cutEl, cut){
  const r=reviewOf(epId, cut.n);
  const statusSel=cutEl.querySelector('[data-review=status]');
  const assigneeSel=cutEl.querySelector('[data-review=assignee]');
  const memo=cutEl.querySelector('[data-review=memo]');
  const badge=cutEl.querySelector('[data-review=badge]');
  if(statusSel) statusSel.value=r.status||'pending';
  if(assigneeSel) assigneeSel.value=r.assignee||'unassigned';
  if(memo && document.activeElement!==memo) memo.value=r.memo||'';
  if(badge){
    const st=r.status||'pending';
    badge.className='badge '+(st==='approved'?'tag-ok':st==='needs_fix'?'tag-fix':'tag-pending');
    badge.textContent=STATUS_LABEL[st]||st;
  }
}

function cutCardHtml(epId, c){
  const takes=c.video?.takes||[];
  const key=String(c.n);
  const selected=selectedTake(epId, c);
  const takeObj=takes.find(t=>t.take===selected) || takes.find(t=>t.path===c.video?.selected) || null;
  const videoSrc=takeObj?.board_src || c.video?.board_src || '';
  const videoLabel=takeObj ? `take${String(takeObj.take).padStart(2,'0')}` : (c.video?.selected ? PathName(c.video.selected) : '');
  const contiStatus=c.conti?.status||'unlinked';
  const contiBadge=contiStatus==='linked'?'연결':contiStatus==='reference'?'참고만':contiStatus==='check'?'확인 필요':'없음';
  const contiTag=contiStatus==='unlinked'?'tag-miss':contiStatus==='reference'?'tag-ref':contiStatus==='check'?'tag-check':contiStatus==='linked'?'tag-ok':'';
  const flag=c.flag;
  const flagBadge=flag&&flag.status==='stale'?`<span class="badge tag-stale">${escape(flag.note||'구 각본 — 재생성 대기')}</span>`:'';
  const imgInner=c.image?.is_ui_mp4
    ? (c.image.board_src?`<video data-vid="${escape(epId)}:ui:${escape(c.n)}" src="${escape(c.image.board_src)}" controls playsinline preload="metadata"></video>`:`<div class="missing">UI mp4 경로 없음</div>`)
    : (c.image?.preview?`<a href="${escape(c.image.preview)}" target="_blank" rel="noopener"><img src="${escape(c.image.preview)}" alt="컷 ${escape(c.n)} 이미지" loading="lazy"></a>`:
       (c.image?.exists?`<div class="missing">미리보기 없음<br><small>${escape(c.image.path||'')}</small></div>`:`<div class="missing">이미지 없음</div>`));
  const cap=c.spoken_line ? `<div class="cap">${escape(c.who?c.who+' · ':'')}${escape(c.line)}</div>` : '';
  const basisLine=c.conti?.basis||c.conti?.reason||'';
  const contiInner=c.conti?.preview
    ? `<a href="${escape(c.conti.preview)}" target="_blank" rel="noopener"><img src="${escape(c.conti.preview)}" alt="컷 ${escape(c.n)} 콘티" loading="lazy"></a>`
    : `<div class="missing">${escape(contiBadge)}<br><small>${escape(c.conti?.reason||'')}</small></div>`;
  const vidInner=videoSrc
    ? `<video data-vid="${escape(epId)}:${escape(c.n)}" src="${escape(videoSrc)}" controls playsinline preload="metadata"></video>${cap}`
    : `<div class="missing">${c.video?.selected?'영상 파일 없음':'영상 없음'}</div>`;
  const takeSelect=takes.length?`<label>테이크 <select data-cut="${escape(key)}" data-ep="${escape(epId)}">${takes.map(t=>`<option value="${t.take}" ${t.take===selected?'selected':''}>take${String(t.take).padStart(2,'0')}${c.video?.default_take===t.take?' · 선택 클립':''}</option>`).join('')}</select></label><span class="cut-meta" data-role="take-label">${escape(videoLabel)}</span>`:'';
  const r=reviewOf(epId, c.n);
  const match=cutMatchesFilter(c)?'1':'0';
  const detailsKey=`${epId}:${c.n}`;
  return `<article class="cut" data-n="${escape(c.n)}" data-ep="${escape(epId)}" data-match="${match}" ${match==='0'?'hidden':''}>
    <div class="cut-head"><h3>컷 ${escape(c.n)}${c.who?` · ${escape(c.who)}`:''}${c.kind==='ui'?' · UI':''}</h3>
    <span class="badge ${contiTag}">콘티 ${escape(contiBadge)}</span>
    ${flagBadge}
    <span class="badge ${r.status==='approved'?'tag-ok':r.status==='needs_fix'?'tag-fix':'tag-pending'}" data-review="badge">${escape(STATUS_LABEL[r.status]||'미검토')}</span></div>
    <div class="line">${c.spoken_line?escape(c.line):(c.line?escape(c.line):'<span class="cut-meta">(대사 없음)</span>')}</div>
    <details class="dir" data-details="${escape(detailsKey)}"><summary>지문</summary><p>${escape(c.direction||'')}${c.emotion?`<br>감정 · ${escape(c.emotion)}`:''}</p></details>
    <div class="cols">
      <div class="col"><h4>콘티</h4><div class="frame">${contiInner}</div>${basisLine?`<p class="basis">${escape(basisLine)}</p>`:''}</div>
      <div class="col"><h4>이미지</h4><div class="frame">${imgInner}${(!c.image?.is_ui_mp4 && c.spoken_line)?cap:''}</div>${c.image?.basis?`<p class="basis">${escape(c.image.basis)}</p>`:''}</div>
      <div class="col"><h4>영상</h4><div class="frame" data-role="video-frame">${vidInner}</div><div class="row-ctrl">${takeSelect}<span class="cut-meta">검토용 · 자동재생 없음</span></div></div>
    </div>
    <div class="review" data-ep="${escape(epId)}" data-cut="${escape(key)}">
      <div class="review-row">
        <label>검토 <select data-review="status">
          <option value="pending">미검토</option>
          <option value="needs_fix">수정 요청</option>
          <option value="approved">승인</option>
        </select></label>
        <label hidden>담당 <select data-review="assignee">
          <option value="unassigned">미지정</option>
          <option value="claude">클로드</option>
          <option value="cursor">커서</option>
          <option value="codex">코덱스</option>
        </select></label>
        <span class="cut-meta">기록 전용 · AI 호출 없음</span>
      </div>
      <label class="cut-meta">수정 메모<textarea data-review="memo" placeholder="수정이 필요하면 메모를 남기세요">${escape(r.memo||'')}</textarea></label>
    </div>
  </article>`;
}

function cutBoard(ep){
  const map=ep.cuts; if(!map) return null;
  const cuts=(map.cuts||[]).filter(c=>c.active);
  const st=map.stats||{};
  const stats=`<div class="stats">
    <span class="badge">활성 ${map.active_cuts||cuts.length}</span>
    <span class="badge">이미지 ${st.with_image??'-'}</span>
    <span class="badge">영상 ${st.with_video??'-'}</span>
    <span class="badge tag-ok">콘티 확정 ${st.conti_linked??0}</span>
    <span class="badge tag-ref">참고 ${st.conti_reference??0}</span>
    <span class="badge tag-check">확인 ${st.conti_check??0}</span>
    <span class="badge tag-miss">미연결 ${st.conti_unlinked??0}</span>
  </div>`;
  const filters=`<div class="filters" role="toolbar" aria-label="컷 필터">
    ${[['all','전체'],['linked','콘티 확정'],['video','영상 있음'],['novideo','영상 없음'],['noconti','콘티 미연결·확인']].map(([k,l])=>
      `<button type="button" data-filter="${k}" aria-pressed="${state.filter===k}">${l}</button>`).join('')}
    <button type="button" data-cap="1" aria-pressed="${state.captions}">자막 ${state.captions?'켜짐':'꺼짐'}</button>
  </div>`;
  const cards=cuts.map(c=>cutCardHtml(ep.id,c)).join('') || '<div class="empty"><h2>활성 컷 없음</h2></div>';
  const epNote=ep.id==='EP02'
    ? '2화 콘티는 현행 시트 칸(C=컷). 기준 이미지는 <code>ep02_image_links.json</code> 근거만 연결. 칸 14~17 스케치는 구 영수증(재생성 대기) 배지.'
    : '1화 콘티는 <code>SCRIPT_CONTI_AUDIT</code> 근거만 반영했습니다(구 C번호 자동매칭 없음).';
  return `<h2>컷별 콘티 · 이미지 · 영상</h2>
    <p class="sub">장면(컷) 단위로 각본 → 임시 제작 → 검토 → 수정 → 승인. ${epNote}</p>
    <div class="notice">검토·테이크·담당자 기록은 프로젝트 JSON(<code>tools/series_board_reviews.json</code>)에 저장됩니다. 보드를 다시 만들어도 유지됩니다. 영상 생성 API는 호출하지 않습니다.</div>
    ${stats}${filters}<div id="cutList">${cards}</div>
    <details class="old"><summary>과거 교체본 · skip 행</summary>
      <p class="sub">skip ${escape((map.skip_ns||[]).join(', ')||'없음')}. _old 테이크는 기본 목록에서 제외했습니다.</p>
    </details>`;
}

function scriptMetaHtml(ep){
  const built=ep.built_at||boardMeta.built_at||'-';
  const mtime=ep.script_mtime||'-';
  const ver=ep.script_version||'-';
  return `<div class="script-meta">
    <span class="badge">각본 ${escape(ep.script||'')}</span>
    <span class="badge">버전 ${escape(ver)}</span>
    <span class="badge">원본 수정 ${escape(mtime)}</span>
    <span class="badge">화면 생성 ${escape(built)}</span>
    <a href="series_sources/${encodeURIComponent(ep.script)}" download>원문 내려받기</a>
  </div>`;
}

function productionHtml(ep){
  return `<h2>장면별 제작 흐름</h2>
    <p class="sub">각본 전체가 끝나야 제작하는 구조가 아닙니다. 장면(컷)마다 아래 순서로 진행합니다.</p>
    <ol class="rules">
      <li><b>각본</b> — 해당 장면 대사·지문 확인</li>
      <li><b>임시 제작</b> — 기존 콘티·이미지·클립으로 검토 준비(이 화면은 유료 생성을 실행하지 않음)</li>
      <li><b>검토</b> — 컷 보드에서 테이크·자막·콘티 연결 확인</li>
      <li><b>수정</b> — 수정 요청 + 메모·담당자 기록</li>
      <li><b>승인</b> — 컷 단위 승인 후 다음 장면으로</li>
    </ol>
    <div class="notice"><b>영상 생성 대기</b><br>이 화면은 힉스필드 등 생성 서비스를 호출하지 않습니다. 사용자가 별도로 영상 생성을 지시한 뒤에만 진행합니다.</div>
    ${ep.id==='EP01'?'<a href="index.html#conti">1화 기존 스틸·영상 자료 보기 ↗</a>':''}
    ${ep.ui?`<p style="margin-top:16px"><a href="${escape(ep.ui)}" target="_blank" rel="noopener">3화 단톡 UI 초안 ↗</a></p>`:''}`;
}

function render(opts={}){
  const preserve=opts.preserve!==false;
  const scrollY=preserve?window.scrollY:0;
  const playback=preserve?capturePlayback():null;
  if(preserve) captureOpenDetails();

  const [id,requested]=location.hash.slice(1).split('/');
  const ep=episodes.find(e=>e.id===id);
  const tab=['story','images','production'].includes(requested)?requested:'story';

  document.getElementById('episodeNav').innerHTML=`<a href="#" ${!ep?'aria-current="page"':''}>전체 회차</a>${episodes.map((e,index)=>`<a href="#${e.id}/${tab}" title="${escape(e.title)}" ${ep&&e.id===ep.id?'aria-current="page"':''}>${index+1}화</a>`).join('')}`;

  if(!ep){
    app.innerHTML=`<small>EPISODES</small><h1>다음 이야기를 준비하는 곳</h1>
      <p class="sub">각본부터, 혹은 한 장의 콘티부터. 회차를 골라 장면 단위로 이어서 작업하세요.</p>
      <div class="notice"><b>장면별 준비</b><br>컷마다 각본 → 임시 제작 → 검토 → 수정 → 승인으로 진행합니다. 각본 전체 확정 전이라도 준비된 장면부터 검토할 수 있습니다. GPT 이미지·힉스필드 유료 생성은 이 화면에서 호출하지 않습니다.</div>
      <div class="grid">${episodes.map(e=>`<article class="card"><small>${e.id}</small><h2>${escape(e.title)}</h2><span class="badge">${escape(e.stage)}</span><p>${escape(e.next)}</p><button class="primary" data-route="${e.id}/story">회차 열기 →</button></article>`).join('')}</div>
      <footer>파일이 있다는 것은 최종 승인되었다는 뜻이 아닙니다. 검토 기록은 서버 JSON에 저장됩니다.</footer>`;
    if(!preserve) window.scrollTo(0,0);
    return;
  }

  const uiLink=ep.ui?`<p><span class="badge">단톡 UI 초안</span> <a href="${escape(ep.ui)}" target="_blank" rel="noopener">미리보기 열기 ↗</a></p>`:'';
  const imagesTab=(()=>{
    const board=cutBoard(ep);
    if(board) return board;
    return `<h2>장면을 보고 이야기 다듬기</h2>
      <p class="sub">각본과 오가며 컷을 정리하세요. 장면이 준비되면 전체 각본 확정 전이라도 임시 제작·검토를 시작할 수 있습니다.</p>
      ${ep.images.length?`<div class="images">${ep.images.map(i=>`<figure><a href="${i.src}" target="_blank" rel="noopener"><img src="${i.src}" alt="${escape(i.name)}" loading="lazy"></a><figcaption>${escape(i.name)}</figcaption></figure>`).join('')}</div>`:'<div class="empty"><h2>첫 콘티를 준비할 차례</h2><p>각본에서 보고 싶은 장면을 골라 GPT 이미지로 시작하세요.<br>인물·장소는 공통 설정을 기준으로 맞춥니다. 이 화면에서는 생성 API를 호출하지 않습니다.</p></div>'}`;
  })();

  app.innerHTML=`<button class="back" data-route="">← 전체 회차</button>
    <h1><small>${ep.id}</small><br>${escape(ep.title)}</h1>
    <p class="sub">다음 작업 · ${escape(ep.next)}</p>
    <nav aria-label="회차 작업">${[['story','이야기'],['images', ep.cuts?'컷별 비교':'콘티·기준 이미지'],['production','최종 제작']].map(([key,label])=>`<button data-route="${ep.id}/${key}" aria-pressed="${key===tab}">${label}</button>`).join('')}</nav>
    <section class="panel">${
      tab==='story'?`${uiLink}${scriptMetaHtml(ep)}<div class="prose">${ep.body}</div>`:
      tab==='images'?imagesTab:
      productionHtml(ep)
    }</section>
    <footer>이야기와 콘티는 어느 쪽부터 시작해도 됩니다. 원문 수정 후 <code>python3 tools/build_series_board.py</code>로 화면을 다시 만들면 각본이 반영됩니다. 검토 기록은 유지됩니다.</footer>`;

  if(tab==='images' && ep.cuts){
    // hydrate review controls from state
    (ep.cuts.cuts||[]).filter(c=>c.active).forEach(c=>{
      const el=app.querySelector(`.cut[data-n="${CSS.escape(String(c.n))}"]`);
      if(el) updateReviewUI(ep.id, el, c);
    });
    applyCaptionMode();
  }

  restoreOpenDetails();
  restorePlayback(playback);
  if(preserve) requestAnimationFrame(()=>window.scrollTo(0, scrollY));
  else window.scrollTo(0,0);
  setSaveUI();
}

function currentEp(){
  const id=location.hash.slice(1).split('/')[0];
  return episodes.find(e=>e.id===id);
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-route]');
  if(b){ location.hash=b.dataset.route; return; }

  const f=e.target.closest('[data-filter]');
  if(f){
    state.filter=f.dataset.filter;
    const ep=currentEp();
    if(ep?.cuts){
      (ep.cuts.cuts||[]).filter(c=>c.active).forEach(c=>{
        const el=app.querySelector(`.cut[data-n="${CSS.escape(String(c.n))}"]`);
        if(!el) return;
        el.dataset.match=cutMatchesFilter(c)?'1':'0';
      });
      applyFilterVisibility();
    } else {
      render({preserve:true});
    }
    return;
  }

  const c=e.target.closest('[data-cap]');
  if(c){
    state.captions=!state.captions;
    applyCaptionMode();
    return;
  }
});

app.addEventListener('change',e=>{
  const s=e.target.closest('select[data-cut]');
  if(s){
    const epId=s.dataset.ep;
    const cutId=s.dataset.cut;
    const take=Number(s.value);
    state.take[epId]=state.take[epId]||{};
    state.take[epId][cutId]=take;
    setReview(epId, cutId, {take});
    const ep=episodes.find(x=>x.id===epId);
    const cut=(ep?.cuts?.cuts||[]).find(c=>String(c.n)===String(cutId));
    const cutEl=s.closest('.cut');
    if(ep && cut && cutEl){
      // 이 컷 영상만 교체 — 다른 영상 재생 유지
      updateCutVideo(epId, cutEl, cut);
    }
    queueSave();
    return;
  }

  const reviewRoot=e.target.closest('.review');
  if(reviewRoot && e.target.matches('[data-review=status], [data-review=assignee]')){
    const epId=reviewRoot.dataset.ep;
    const cutId=reviewRoot.dataset.cut;
    const status=reviewRoot.querySelector('[data-review=status]')?.value||'pending';
    const assignee=reviewRoot.querySelector('[data-review=assignee]')?.value||'unassigned';
    setReview(epId, cutId, {status, assignee});
    const cutEl=reviewRoot.closest('.cut');
    const ep=episodes.find(x=>x.id===epId);
    const cut=(ep?.cuts?.cuts||[]).find(c=>String(c.n)===String(cutId));
    if(cutEl && cut) updateReviewUI(epId, cutEl, cut);
    queueSave();
  }
});

app.addEventListener('input',e=>{
  const ta=e.target.closest('textarea[data-review=memo]');
  if(!ta) return;
  const root=ta.closest('.review');
  if(!root) return;
  setReview(root.dataset.ep, root.dataset.cut, {memo:ta.value});
  queueSave();
});

app.addEventListener('toggle',e=>{
  const d=e.target.closest('details[data-details]');
  if(!d) return;
  if(d.open) state.openDetails.add(d.dataset.details);
  else state.openDetails.delete(d.dataset.details);
}, true);

saveBtn.addEventListener('click',()=>persistReviews());

window.addEventListener('hashchange',()=>{
  state.filter='all';
  render({preserve:false});
});

(async function boot(){
  await loadReviews();
  // 저장된 테이크를 state.take에도 반영
  Object.entries(state.reviews).forEach(([epId, ep])=>{
    state.take[epId]=state.take[epId]||{};
    Object.entries(ep.cuts||{}).forEach(([cutId, rec])=>{
      if(rec && rec.take!=null) state.take[epId][cutId]=rec.take;
    });
  });
  applyCaptionMode();
  render({preserve:false});
})();
</script>
</html>
