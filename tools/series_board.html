<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>연남동 3층집 · 회차 작업실</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--paper:#fffefa;--ink:#262f29;--muted:#69736b;--line:#dddeda;--green:#285b45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header,main{max-width:1160px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}a{color:var(--green)}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b58a30;outline-offset:4px}.brand{font-size:19px;font-weight:750}.sub,small{color:var(--muted)}h1{font-size:clamp(28px,4vw,42px);line-height:1.3;letter-spacing:-1px}h2{font-size:23px}p{margin:10px 0 20px}.notice{background:#eaf0e9;border:1px solid #d7e2d5;padding:18px 22px;border-radius:14px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px}.card{display:flex;flex-direction:column;align-items:start;gap:8px}.card h2{margin:0}.card p{flex:1}.badge{background:#edece4;border-radius:30px;padding:4px 12px;font-size:13px}.primary{background:var(--green);color:white;border:0;border-radius:9px;padding:10px 20px}.back{border:0;background:none;padding:0;color:var(--green)}nav{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}nav button{border:1px solid var(--line);background:var(--paper);padding:10px 20px;border-radius:30px}nav button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.prose{max-width:900px;overflow-wrap:anywhere}.prose h1{font-size:26px}.prose h2{margin-top:32px}.prose table{display:block;overflow:auto;border-collapse:collapse;font-size:14px}.prose th,.prose td{border:1px solid var(--line);padding:9px;min-width:95px}.prose img{max-width:100%}.images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.images figure{margin:0}.images img{width:100%;border-radius:10px;display:block}.images figcaption{font-size:13px;color:var(--muted);margin:8px 0;overflow-wrap:anywhere}.empty{padding:38px 12px;text-align:center}.rules{padding-left:22px}.rules li{margin:10px 0}footer{margin-top:28px;font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:760px){header,main{padding:20px}.grid,.images{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.panel{padding:18px}}
</style>
<style>
.episode-nav{position:sticky;top:0;z-index:10;max-width:1160px;margin:0 auto;padding:12px 28px;background:var(--bg);border-bottom:1px solid var(--line);gap:8px}
.episode-nav a{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border:1px solid var(--line);border-radius:30px;background:var(--paper);text-decoration:none;white-space:nowrap}
.episode-nav a[aria-current=page]{background:var(--green);border-color:var(--green);color:white}
@media(max-width:760px){.episode-nav{padding:10px 20px;gap:6px}.episode-nav a{padding:8px 14px}}
.cut-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.cut-tools button{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:30px}.cut-tools button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}
.cut{margin:0 0 16px}.cut h3{margin:0 0 6px}.cut .line{margin:0 0 8px;font-size:18px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.cell{background:#f7f6f2;border-radius:12px;padding:10px;min-width:0}.cell .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.cell img,.cell video{width:100%;max-width:100%;border-radius:8px;display:block;background:#1c1c1c}.shot{position:relative;display:block}.cap{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:13px;line-height:1.4;padding:6px 8px;border-radius:6px}
.miss{padding:28px 8px;text-align:center;color:var(--muted);background:#fff;border-radius:8px}.basis{font-size:13px;color:var(--muted);margin:8px 0 0}.review{font-size:12px;color:var(--muted);margin:6px 0 0}
.badge.linked{background:#e5f2ea;color:#285b45}.badge.reference{background:#f3ead2;color:#6a4b12}.badge.check{background:#f8e4d8;color:#8a3b12}.badge.unlinked{background:#edece4;color:#5c6560}.badge.stale{background:#f8e4d8;color:#8a3b12}
.ep02-sheet{margin:0 0 22px}.ep02-sheet h3{margin:8px 0}.ep02-sheet figure{margin:0 0 10px}.ep02-sheet img{width:100%;border-radius:10px;display:block}
.ep02-cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.ep02-cell{background:#f7f6f2;border-radius:12px;padding:10px;min-width:0}.ep02-cell .k{font-size:12px;color:var(--muted);margin-bottom:6px}
select.takes{width:100%;margin:0 0 8px;font:inherit}
@media(max-width:760px){.cols,.ep02-cells{grid-template-columns:1fr}}
</style>
<header><div><div class="brand">연남동 3층집</div><small>시리즈 작업실</small></div><a href="index.html#board">공통 캐릭터·장소 / 기존 보드 ↗</a></header>
<nav class="episode-nav" id="episodeNav" aria-label="회차 바로가기"></nav>
<main id="app"></main>
<script type="application/json" id="episodes">__EPISODES__</script>
<script>
const episodes=JSON.parse(document.getElementById('episodes').textContent),app=document.getElementById('app');
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cutFilter='all',showSub=true;
const CONTI_BADGE={linked:'연결',reference:'참고만',check:'확인 필요',unlinked:'없음'};
function cutPasses(cut){
 if(cutFilter==='video')return (cut.video.takes||[]).some(t=>t.exists);
 if(cutFilter==='novideo')return !(cut.video.takes||[]).some(t=>t.exists);
 if(cutFilter==='noconti')return cut.conti.status==='unlinked'||cut.conti.status==='check';
 return true;
}
function contiCell(cut){
 const conti=cut.conti,status=conti.status;
 const badge=`<span class="badge ${escape(status)}">${CONTI_BADGE[status]||''}</span>`;
 let body;
 if(conti.preview_ready&&conti.preview)body=`<a href="${escape(conti.preview)}" target="_blank" rel="noopener"><img src="${escape(conti.preview)}" alt="컷 ${cut.n} 콘티"></a>`;
 else if(status==='unlinked'&&cut.kind==='ui')body='<div class="miss">UI, 콘티 대상 아님</div>';
 else if(status==='unlinked')body='<div class="miss">미연결</div>';
 else if(status==='check')body='<div class="miss">확인 필요</div>';
 else body=`<div class="miss">콘티 파일 없음</div>${conti.path?`<small>${escape(conti.path)}</small>`:''}`;
 const basis=conti.basis?`<p class="basis">${escape(conti.basis)}</p>`:'';
 return `<div class="cell"><div class="k">콘티</div>${badge}${body}${basis}</div>`;
}
function imageCell(cut){
 const cap=showSub&&cut.spoken?`<span class="cap">${escape(cut.spoken)}</span>`:'';
 if(cut.kind==='ui')return `<div class="cell"><div class="k">이미지</div><div class="miss">UI 영상</div><small>${escape(cut.frame||'')}</small></div>`;
 const image=cut.image||{};
 if(image.preview_ready&&image.preview)return `<div class="cell"><div class="k">이미지</div><a class="shot" href="${escape(image.preview)}" target="_blank" rel="noopener"><img src="${escape(image.preview)}" alt="컷 ${cut.n} 이미지">${cap}</a><p class="review">검토용 자막. 원본에 굽지 않습니다.</p></div>`;
 return `<div class="cell"><div class="k">이미지</div><div class="miss shot">이미지 없음${cap}</div></div>`;
}
function videoCell(cut){
 const takes=cut.video.takes||[];
 if(!takes.length)return '<div class="cell"><div class="k">영상</div><div class="miss">영상 없음</div></div>';
 const chosen=takes.find(t=>t.take!=null&&t.take===cut.video.default_take)||takes.find(t=>t.path===cut.video.clip)||takes[0];
 const options=takes.map(t=>`<option value="${escape(t.src||'')}" data-exists="${t.exists?1:0}" ${t.path===chosen.path?'selected':''}>${escape(t.name)}${t.exists?'':' · 없음'}</option>`).join('');
 const player=chosen.exists&&chosen.src?`<video controls playsinline preload="metadata" src="${escape(chosen.src)}"></video>`:'<div class="miss">영상 없음</div>';
 const picker=takes.length>1?`<select class="takes" aria-label="테이크">${options}</select>`:`<p class="clipname">${escape(chosen.name)}</p>`;
 return `<div class="cell"><div class="k">영상</div>${picker}${player}<p class="review">검토용 재생. 대사 싱크가 끝난 자막이 아닙니다.</p></div>`;
}
function cutArticle(cut){
 const who=cut.who?` · ${escape(cut.who)}`:'';
 const line=cut.spoken?escape(cut.spoken):'대사 없음';
 const extra=cut.direction?`<details><summary>지문</summary><p>${escape(cut.direction)}</p></details>`:'';
 return `<article class="panel cut" data-status="${escape(cut.conti.status)}" data-n="${cut.n}"><h3>컷 ${cut.n}${who}</h3><p class="line">${line}</p>${extra}<div class="cols">${contiCell(cut)}${imageCell(cut)}${videoCell(cut)}</div></article>`;
}
function renderEp01Cuts(ep){
 const stats=ep.cutStats||{},active=(ep.cuts||[]).filter(c=>!c.skip),skipped=(ep.cuts||[]).filter(c=>c.skip);
 const shown=active.filter(cutPasses);
 const filters=[['all','전체'],['video','영상 있음'],['novideo','영상 없음'],['noconti','콘티 미연결']].map(([key,label])=>`<button type="button" data-cut-filter="${key}" aria-pressed="${cutFilter===key}">${label}</button>`).join('');
 const cards=shown.length?shown.map(cutArticle).join(''):'<div class="empty"><h2>해당하는 컷이 없습니다</h2></div>';
 const skipBlock=skipped.length?`<details class="panel"><summary>제외 컷 ${skipped.map(c=>c.n).join(' · ')}</summary>${skipped.map(cutArticle).join('')}</details>`:'';
 return `<h2>컷별 콘티 · 이미지 · 영상</h2><p class="sub">활성 ${stats.active||active.length} · 연결 ${stats.conti_linked??''} · 참고만 ${stats.conti_reference??''} · 확인 필요 ${stats.conti_check??''} · 없음 ${stats.conti_unlinked??''} (UI ${stats.conti_unlinked_ui??''}) · 지정 영상 ${stats.clips_designated??''} / 파일 있음 ${stats.clips_exist??''}</p><div class="cut-tools" role="group" aria-label="컷 필터">${filters}<button type="button" data-cut-sub aria-pressed="${showSub}">자막 ${showSub?'켜짐':'꺼짐'}</button></div>${cards}${skipBlock}`;
}
function renderGallery(ep){
 return `<h2>장면을 보고 이야기 다듬기</h2><p class="sub">각본과 오가며 컷을 정리하세요. 아래는 기존 콘티 자료이며, 영상 입력용 최종 기준 이미지 여부는 별도 확인이 필요합니다.</p>${ep.images.length?`<div class="images">${ep.images.map(i=>`<figure><a href="${i.src}" target="_blank" rel="noopener"><img src="${i.src}" alt="${escape(i.name)}" loading="lazy"></a><figcaption>${escape(i.name)}</figcaption></figure>`).join('')}</div>`:'<div class="empty"><h2>첫 콘티를 준비할 차례</h2><p>각본에서 보고 싶은 장면을 골라 GPT 이미지로 시작하세요.<br>인물·장소는 공통 설정을 기준으로 맞춥니다.</p></div>'}`;
}
function renderEp02(ep){
 const panels=ep.panels||[];
 const sheets=[];
 panels.forEach(p=>{
  let sheet=sheets.find(s=>s.sheet===p.sheet);
  if(!sheet){sheet={sheet:p.sheet,src:p.src,file:p.file,cells:[]};sheets.push(sheet);}
  sheet.cells.push(p);
 });
 const blocks=sheets.map(sheet=>{
  const fig=sheet.src?`<figure><a href="${escape(sheet.src)}" target="_blank" rel="noopener"><img src="${escape(sheet.src)}" alt="${escape(sheet.file)}" loading="lazy"></a><figcaption>${escape(sheet.file)}</figcaption></figure>`:'';
  const cells=sheet.cells.map(p=>{
   const stale=p.flag&&p.flag.status==='stale';
   const badge=stale?'<span class="badge stale">구 각본(영수증) — 재생성 대기</span>':'';
   const note=p.flag&&p.flag.note?`<p class="basis">${escape(p.flag.note)}</p>`:'';
   return `<article class="ep02-cell" data-panel="${p.n}" data-sheet="${p.sheet}"><div class="k">칸 ${p.n}</div>${badge}<small>${escape(p.file)}</small>${note}</article>`;
  }).join('');
  return `<section class="ep02-sheet" data-sheet="${sheet.sheet}"><h3>시트 ${sheet.sheet}</h3>${fig}<div class="ep02-cells">${cells}</div></section>`;
 }).join('');
 const waiting=panels.filter(p=>p.flag&&p.flag.status==='stale').length;
 return `<h2>장면을 보고 이야기 다듬기</h2><p class="sub">각본과 오가며 컷을 정리하세요. 아래는 기존 콘티 자료이며, 영상 입력용 최종 기준 이미지 여부는 별도 확인이 필요합니다.</p><p class="sub">콘티 칸 ${panels.length} · 재생성 대기 ${waiting}</p>${blocks}`;
}
function render(){
 const [id,requested]=location.hash.slice(1).split('/'),ep=episodes.find(e=>e.id===id),tab=['story','images','production'].includes(requested)?requested:'story';
 document.getElementById('episodeNav').innerHTML=`<a href="#" ${!ep?'aria-current="page"':''}>전체 회차</a>${episodes.map((e,index)=>`<a href="#${e.id}/${tab}" title="${escape(e.title)}" ${ep&&e.id===ep.id?'aria-current="page"':''}>${index+1}화</a>`).join('')}`;
 if(!ep){app.innerHTML=`<small>EPISODES</small><h1>다음 이야기를 준비하는 곳</h1><p class="sub">각본부터, 혹은 한 장의 콘티부터. 회차를 골라 이어서 작업하세요.</p><div class="notice"><b>지금은 영상 전 준비에 집중</b><br>GPT 이미지로 콘티와 기준 이미지를 준비하고, 최종 확정 후 힉스필드 영상 제작으로 넘어갑니다.</div><div class="grid">${episodes.map(e=>`<article class="card"><small>${e.id}</small><h2>${escape(e.title)}</h2><span class="badge">${escape(e.stage)}</span><p>${escape(e.next)}</p><button class="primary" data-route="${e.id}/story">회차 열기 →</button></article>`).join('')}</div><footer>파일이 있다는 것은 최종 승인되었다는 뜻이 아닙니다. 기존 자료를 연결한 검토용 화면입니다.</footer>`;return;}
 const uiLink=ep.ui?`<p><span class="badge">단톡 UI 초안</span> <a href="${escape(ep.ui)}" target="_blank" rel="noopener">미리보기 열기 ↗</a></p>`:'';
 app.innerHTML=`<button class="back" data-route="">← 전체 회차</button><h1><small>${ep.id}</small><br>${escape(ep.title)}</h1><p class="sub">다음 작업 · ${escape(ep.next)}</p><nav aria-label="회차 작업">${[['story','이야기'],['images','콘티·기준 이미지'],['production','최종 제작']].map(([key,label])=>`<button data-route="${ep.id}/${key}" aria-pressed="${key===tab}">${label}</button>`).join('')}</nav><section class="panel">${tab==='story'?`${uiLink}<p><span class="badge">검토용 각본</span> <a href="series_sources/${encodeURIComponent(ep.script)}" download>원문 내려받기</a></p><div class="prose">${ep.body}</div>`:tab==='images'?(ep.id==='EP01'&&ep.cuts?renderEp01Cuts(ep):ep.id==='EP02'?renderEp02(ep):renderGallery(ep)):`<h2>최종 확정 후 영상 제작</h2><p>각본과 이미지 수정은 이 단계에 들어오기 전에 마무리합니다.</p><ol class="rules"><li>대사·지문·컷 순서 최종 확인</li><li>콘티의 인물·동선·장소 연결 확인</li><li>영상에 넣을 컷별 기준 이미지 확정</li><li>생성할 컷 수와 예상 크레딧 확인</li><li>사용자가 영상 생성을 명시적으로 지시한 뒤 힉스필드 진행</li></ol><div class="notice"><b>영상 생성 대기</b><br>이 화면은 생성 서비스를 호출하지 않습니다. 확정 후 내용이 바뀌면 해당 컷을 다시 검토합니다.</div>${ep.id==='EP01'?'<a href="index.html#conti">1화 기존 스틸·영상 자료 보기 ↗</a>':''}${ep.ui?`<p style="margin-top:16px"><a href="${escape(ep.ui)}" target="_blank" rel="noopener">3화 단톡 UI 초안 ↗</a></p>`:''}`}</section><footer>이야기와 콘티는 어느 쪽부터 시작해도 됩니다. 원문 수정 후 화면을 다시 생성하면 반영됩니다.</footer>`;
}
app.addEventListener('click',e=>{
 const filter=e.target.closest('[data-cut-filter]');
 if(filter){cutFilter=filter.dataset.cutFilter;render();return;}
 const sub=e.target.closest('[data-cut-sub]');
 if(sub){showSub=!showSub;render();return;}
 const b=e.target.closest('[data-route]');if(b){location.hash=b.dataset.route;window.scrollTo(0,0);}
});
app.addEventListener('change',e=>{
 const select=e.target.closest('select.takes');
 if(!select)return;
 const opt=select.selectedOptions[0];
 const cell=select.closest('.cell');
 let video=cell.querySelector('video');
 let miss=cell.querySelector('.miss');
 if(opt.dataset.exists==='1'&&opt.value){
  if(!video){video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';if(miss)miss.replaceWith(video);else cell.appendChild(video);}
  video.src=opt.value;
 }else if(video){
  const empty=document.createElement('div');empty.className='miss';empty.textContent='영상 없음';video.replaceWith(empty);
 }
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});render();
</script>
</html>
